name: ci

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: never
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # git needs an identity for the tests that make commits in temp repositories.
      - run: git config --global user.email ci@example.invalid && git config --global user.name ci
      - run: cargo build --all-targets
      - run: cargo test
      # The terminal UX suite drives the real binary over a pseudo-terminal with a fake model
      # CLI and a fake Jev: no accounts, no quota.
      - run: cargo build --bin code
      - run: python3 -I scripts/test_pty_ux.py

  windows:
    name: build (windows, no pty suite)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
