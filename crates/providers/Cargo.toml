[package]
name = "jev-providers"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[features]
# Test helpers other crates' tests use.
testing = ["jev-backend/testing", "jev-catalog/testing", "jev-shared/testing"]

[dependencies]
jev-backend = { path = "../backend" }
jev-catalog = { path = "../catalog" }
jev-shared = { path = "../shared" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
jev-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["net"] }
jev-backend = { path = "../backend", features = ["testing"] }
jev-catalog = { path = "../catalog", features = ["testing"] }
jev-shared = { path = "../shared", features = ["testing"] }
