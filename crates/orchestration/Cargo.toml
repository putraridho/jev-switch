[package]
name = "jev-orchestration"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[features]
# Test helpers other crates' tests use.
testing = ["jev-backend/testing", "jev-catalog/testing", "jev-judgment/testing", "jev-providers/testing", "jev-shared/testing"]

[dependencies]
jev-backend = { path = "../backend" }
jev-catalog = { path = "../catalog" }
jev-judgment = { path = "../judgment" }
jev-providers = { path = "../providers" }
jev-shared = { path = "../shared" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
jev-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["net"] }
jev-backend = { path = "../backend", features = ["testing"] }
jev-catalog = { path = "../catalog", features = ["testing"] }
jev-judgment = { path = "../judgment", features = ["testing"] }
jev-providers = { path = "../providers", features = ["testing"] }
jev-shared = { path = "../shared", features = ["testing"] }
