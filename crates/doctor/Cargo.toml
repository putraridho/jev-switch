[package]
name = "jev-doctor"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[features]
# Test helpers other crates' tests use.
testing = ["jev-judgment/testing", "jev-providers/testing", "jev-shared/testing"]

[dependencies]
jev-judgment = { path = "../judgment" }
jev-providers = { path = "../providers" }
jev-shared = { path = "../shared" }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
jev-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["net"] }
jev-judgment = { path = "../judgment", features = ["testing"] }
jev-providers = { path = "../providers", features = ["testing"] }
jev-shared = { path = "../shared", features = ["testing"] }
