[package]
name = "jev-judgment"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[features]
# Test helpers other crates' tests use.
testing = ["jev-catalog/testing", "jev-shared/testing"]

[dependencies]
jev-catalog = { path = "../catalog" }
jev-shared = { path = "../shared" }
anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
jev-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["net"] }
jev-catalog = { path = "../catalog", features = ["testing"] }
jev-shared = { path = "../shared", features = ["testing"] }
