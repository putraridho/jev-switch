[package]
name = "jev-catalog"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[features]
# Test helpers other crates' tests use.
testing = ["jev-shared/testing"]

[dependencies]
jev-shared = { path = "../shared" }
serde_json = { workspace = true }

[dev-dependencies]
jev-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["net"] }
jev-shared = { path = "../shared", features = ["testing"] }
