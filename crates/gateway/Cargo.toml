[package]
name = "jev-gateway"
version.workspace = true
edition.workspace = true
publish = false

[lib]
doctest = false

[features]
# Test helpers other crates' tests use.
testing = ["jev-catalog/testing", "jev-judgment/testing", "jev-orchestration/testing", "jev-routing/testing", "jev-shared/testing"]

[dependencies]
jev-catalog = { path = "../catalog" }
jev-judgment = { path = "../judgment" }
jev-orchestration = { path = "../orchestration" }
jev-routing = { path = "../routing" }
jev-shared = { path = "../shared" }
anyhow = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
jev-testkit = { path = "../testkit" }
tokio = { workspace = true, features = ["net"] }
jev-catalog = { path = "../catalog", features = ["testing"] }
jev-judgment = { path = "../judgment", features = ["testing"] }
jev-orchestration = { path = "../orchestration", features = ["testing"] }
jev-routing = { path = "../routing", features = ["testing"] }
jev-shared = { path = "../shared", features = ["testing"] }
