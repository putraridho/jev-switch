[package]
name = "jev-usage-io"
version = "0.1.0"
edition = "2021"
publish = false
description = "Flashboard's IO shell: sources, subprocess, HTTP, SQLite history and the one service loop."

[lib]
doctest = false

[features]
# Fakes and test constructors (FakeClock, FakeTimer, ScriptedProbe, diag capture, proc/http
# test constructors). Enabled only by dev-dependencies and tests.
test-support = []

[dependencies]
jev-usage-core = { path = "../usage-core" }
jev-engine = { package = "jev-embed", path = "../../../crates/embed" }
tokio = { version = "=1.53.3", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "process", "io-util", "net"] }
inotify = { version = "=0.11.5", default-features = false }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
rustix = { version = "=1.1.6", features = ["event", "fs", "process", "time"] }
zeroize = "=1.9.0"
serde_json = "=1.0.151"

[dev-dependencies]
jev-usage-io = { path = ".", features = ["test-support"] }
tokio = { version = "=1.53.3", features = ["test-util"] }
tempfile = "=3.27.0"
proptest = "=1.12.0"

# The same table in all three app crates (DESIGN 5 invariant 3, 11.1); a test compares them.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# The pedantic allow-list: style opinions that fight the signatures fixed by the design.
module_name_repetitions = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
struct_excessive_bools = "allow"
unused_async = "allow"
unused_self = "allow"
