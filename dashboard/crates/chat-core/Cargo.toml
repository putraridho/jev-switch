[package]
name = "jev-chat-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Flashboard's chat domain and typed IPC models for the coding-agent tab."

[lib]
doctest = false

[features]
# Derives `ts_rs::TS` on the IPC types so tests can export dashboard/src/lib/ipc/chat-bindings/*.ts.
bindings = ["dep:ts-rs", "jev-usage-core/bindings"]

[dependencies]
jev-usage-core = { path = "../usage-core" }
serde = { version = "=1.0.229", features = ["derive"] }
ts-rs = { version = "=10.1.0", optional = true }

# The same table in all app crates (DESIGN 5 invariant 3, 11.1).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"
# The pedantic allow-list: style opinions that fight the signatures fixed by the design.
module_name_repetitions = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
trivially_copy_pass_by_ref = "allow"
struct_excessive_bools = "allow"
unused_async = "allow"
unused_self = "allow"
