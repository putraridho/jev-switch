<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- A private session bus on which NOTHING can be activated (DESIGN 8.8): there is no
     <standard_session_servicedirs/> and no <servicedir>, so no notification daemon, portal
     or accessibility service is ever started for a test launch of the real binary.
     Pass this file to dbus-run-session with its config-file option. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
