[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
resolver = "2"

[workspace.package]
version = "1.14.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread", "io-std", "io-util", "process", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures-util = { version = "0.3", default-features = false }
rustyline = "14"
unicode-width = "=0.2.2"
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
libc = "0.2"

[package]
name = "jev-router"
version = "1.14.0"
edition = "2021"
description = "A Jev-gated router for Claude Code: a gateway for jev-claude that routes between Claude models, and jev-code, a terminal agent that routes across Claude, Codex, Gemini, Grok and DeepSeek with failover and orchestration."

[lib]
# There are no doc-tests; skipping the doc-test pass saves a compile on every `cargo test`.
doctest = false

[dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
rustyline = { workspace = true }
unicode-width = { workspace = true }
crossterm = { workspace = true }
jev-shared = { path = "crates/shared" }
jev-catalog = { path = "crates/catalog" }
jev-approval = { path = "crates/approval" }
jev-changes = { path = "crates/changes" }
jev-judgment = { path = "crates/judgment" }
jev-backend = { path = "crates/backend" }
jev-routing = { path = "crates/routing" }
jev-providers = { path = "crates/providers" }
jev-session = { path = "crates/session" }
jev-orchestration = { path = "crates/orchestration" }
jev-doctor = { path = "crates/doctor" }
jev-chat = { path = "crates/chat" }
jev-turn = { path = "crates/turn" }
jev-gateway = { path = "crates/gateway" }
jev-tui = { path = "crates/tui" }
jev-calibration = { path = "crates/calibration" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
jev-testkit = { path = "crates/testkit" }
tokio = { workspace = true, features = ["net"] }

[[bin]]
name = "chat"
path = "src/bin/chat.rs"
# No tests of its own: no empty test harness to build on every `cargo test`.
test = false

[[bin]]
name = "tune"
path = "src/bin/tune.rs"
# No tests of its own: no empty test harness to build on every `cargo test`.
test = false

[[bin]]
name = "route"
path = "src/bin/route.rs"
# No tests of its own: no empty test harness to build on every `cargo test`.
test = false

[[bin]]
name = "code"
path = "src/bin/code.rs"
# No tests of its own: no empty test harness to build on every `cargo test`.
test = false

[[bin]]
name = "gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "ask"
path = "src/bin/ask.rs"
# No tests of its own: no empty test harness to build on every `cargo test`.
test = false

[[bin]]
name = "orch_tune"
path = "src/bin/orch_tune.rs"

[[bin]]
name = "delegate_mcp"
path = "src/bin/delegate_mcp.rs"

# Debug builds keep file and line numbers for backtraces but not variable-level debug info:
# a cold `cargo build --all-targets` is about a quarter faster and `target/` smaller.
[profile.dev]
debug = "line-tables-only"

# What `scripts/install.sh` builds for this machine: release speed, but incremental, so
# reinstalling after a small change recompiles only what changed. Releases use `release`.
[profile.local]
inherits = "release"
incremental = true
codegen-units = 256
